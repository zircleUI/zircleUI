<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zircle: circular, zoomable interfaces built with Orbit and Zumly. No framework required.">
  <title>Zircle · Back to the circles</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="stylesheet" href="/dist/zircle.css"><link rel="stylesheet" href="/public/index.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/" aria-label="Zircle home"><span class="brand-circle" aria-hidden="true"></span>zircle</a>
    <nav aria-label="Examples"><button type="button" data-example="home" aria-pressed="true">Original demo</button><button type="button" data-example="components" aria-pressed="false">Components</button></nav>
    <a class="source-link" href="https://github.com/zircleUI/zircleUI">GitHub ↗</a>
  </header>
  <main>
    <div class="intro"><p class="eyebrow">A zoomable UI library</p><h1 id="title">Welcome to Zircle.</h1><p id="subtitle">Sun, Earth & Moon — back to where it started.</p></div>
    <div id="demo" aria-label="Interactive Zircle example"></div>
    <p id="hint" class="hint">Click or touch a circle to explore.</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer><span>Built with <a href="https://github.com/zumerlab/orbit">Orbit</a> + <a href="https://github.com/zumerlab/zumly">Zumly</a></span><span>Framework-free · 2.0 alpha</span></footer>
  <script type="module" src="/src/demo/app.js"></script>
</body>
</html>
